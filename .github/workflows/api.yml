name: M1 checks
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: steelos
          POSTGRES_PASSWORD: steelos
          POSTGRES_DB: steelos_test
        ports: ['5432:5432']
        options: >-
          --health-cmd 'pg_isready -U steelos'
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://steelos:steelos@localhost:5432/steelos_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - run: python -m pip install -r apps/api/requirements.txt
      - run: ruff check apps/api && ruff format --check apps/api
      - run: cd apps/api && alembic upgrade head && alembic check
      - run: python -m pytest -q
      - run: pip-audit -r apps/api/requirements.txt --progress-spinner off
  frontend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: steelos
          POSTGRES_PASSWORD: steelos
          POSTGRES_DB: steelos_test
        ports: ['5432:5432']
        options: >-
          --health-cmd 'pg_isready -U steelos'
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://steelos:steelos@localhost:5432/steelos_test
      PYTHONPATH: apps/api
      PLAYWRIGHT_PRODUCTION: "1"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: python -m pip install -r apps/api/requirements.txt
      - run: cd apps/api && alembic upgrade head
      - run: python apps/api/tests/seed_e2e.py
      - run: uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/steelos-api.log 2>&1 &
      - run: npm ci && npm run typecheck && npm run build && npm audit --audit-level=moderate
        working-directory: apps/web
      - run: npx playwright install --with-deps chromium && npm test
        working-directory: apps/web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: apps/web/test-results
